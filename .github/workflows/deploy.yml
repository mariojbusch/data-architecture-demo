name: Deploy to Cloud Run Jobs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-architecture-demo/data-architecture-demo:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy data-architecture-demo \
            --image="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-architecture-demo/data-architecture-demo:latest" \
            --region="${{ secrets.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Create or update Cloud Scheduler job
        run: |
          SCHEDULER_NAME="run-data-architecture-demo-daily"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ secrets.GCP_REGION }}"
          SA_EMAIL="github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

          # Try to update; if it doesn't exist, create it
          gcloud scheduler jobs describe "$SCHEDULER_NAME" --location="$REGION" \
          && gcloud scheduler jobs update http "$SCHEDULER_NAME" \
              --schedule="0 0 * * *" \
              --time-zone="America/Sao_Paulo" \
              --uri="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/data-architecture-demo:run" \
              --http-method=POST \
              --oauth-service-account-email="$SA_EMAIL" \
              --location="$REGION" \
          || gcloud scheduler jobs create http "$SCHEDULER_NAME" \
              --schedule="0 0 * * *" \
              --time-zone="America/Sao_Paulo" \
              --uri="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/data-architecture-demo:run" \
              --http-method=POST \
              --oauth-service-account-email="$SA_EMAIL" \
              --location="$REGION"
